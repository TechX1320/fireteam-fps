AddAction Axis1 -1

enabledevice "##keyboard"
rangebind "##keyboard" "##1" 0.000000 0.000000 "Quit"
rangebind "##keyboard" "D" 0.000000 0.000000 "MoveRight"
rangebind "##keyboard" "A" 0.000000 0.000000 "MoveLeft"
rangebind "##keyboard" "W" 0.000000 0.000000 "MoveForward"
rangebind "##keyboard" "S" 0.000000 0.000000 "MoveBackward"
rangebind "##keyboard" "##208" 0.000000 0.000000 "MoveBackward"
rangebind "##keyboard" "##200" 0.000000 0.000000 "MoveForward"
rangebind "##keyboard" "##203" 0.000000 0.000000 "MoveLeft"
rangebind "##keyboard" "##205" 0.000000 0.000000 "MoveRight"
rangebind "##keyboard" "##57" 0.000000 0.000000 "Jump"
rangebind "##keyboard" "T" 0.000000 0.000000 "Chat"
rangebind "##keyboard" "Enter" 0.000000 0.000000 "Start"
rangebind "##keyboard" "Tab" 0.000000 0.000000 "ShowStats"
enabledevice "##mouse"
rangebind "##mouse" "##x-axis" 0.000000 0.000000 "Axis1"
scale "##mouse" "##x-axis" 0.001500
rangebind "##mouse" "##y-axis" 0.000000 0.000000 "Axis2"
scale "##mouse" "##y-axis" 0.001500
rangebind "##mouse" "Button 0" 0.000000 0.000000 "Shoot"
rangebind "##mouse" "Button 1" 0.000000 0.000000 "AltAttack"
rangebind "##mouse" "##z-axis" 0.000000 0.000000 "Axis3"
scale "##mouse" "##z-axis" 0.040000
ModelAdd 0.000000 0.000000 0.000000
