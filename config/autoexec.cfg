"screenwidth" "1280"
"screenheight" "720"
"DetailTextures" "1"
"enabledevice" "##mouse"
"EnvMapEnable" "1.000000"
"ModelShadow_Proj_Enable" "1"
"ForceClear" "1"
AddAction MoveForward 1
AddAction MoveBackward 2
AddAction MoveLeft 3
AddAction MoveRight 4
AddAction MoveUp 5
AddAction MoveDown 6
AddAction TurnLeft 7
AddAction TurnRight 8
AddAction LookUp 9
AddAction LookDown 10
AddAction Shoot 15
AddAction Jump 16
AddAction ShowStats 17
AddAction Start 18
AddAction Chat 19
AddAction AltAttack 20
AddAction Quit 250
AddAction Axis3 -3
