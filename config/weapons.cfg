# Fireteam server-authoritative weapon definitions.
# The dedicated/host server reads its own copy and is authoritative for ammo,
# damage, fire cadence, reloads and projectile damage. A modified client file
# cannot grant ammo or increase damage.
#
# Values marked CA are taken from the supplied decrypted Combat Arms data.
# M67 G62 and LAW Missile projectile model/speed/lifetime values now come from
# ProjectileFX data. Reload timings remain DEV where CA timing is not resolved.

# Crosshair animation values are DEV presentation tuning and are external so
# custom weapons can define their own HUD behavior without recompiling.
