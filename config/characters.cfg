# FIRETEAM character/model presentation.
# Edit this file to change models, textures, face offsets and animation sources
# without recompiling the game.

[normal_common]
# Combat Arms AIModel Normal_Infecter_Common_D:
# ModelFile=MT_AR_BODY, Skin0=MT_AR_BODY, Skin1=MT_MG_LEG,
# AttachFace=1, AIFace=INFECTED_VIRUS_FACE.
body_model=Characters/infected/body/MT_AR_BODY.LTB
animation_model=Characters/infected/body/ST_M_CHILD.LTB
body_texture0=Characters/infected/body/MT_AR_BODY.DTX
body_texture1=Characters/infected/body/MT_MG_LEG.DTX
body_renderstyle0=RenderStyles/default.ltb
body_renderstyle1=RenderStyles/GLOW.LTB

# AttachFace=1 is treated as an attached face model rather than another
# body child-model database. Auto-align subtracts the face model's own Head
# node position before attaching it to the body's Head socket.
face_mode=attachment
face_model=Characters/infected/face/CM_FC_NM_VIRUS_HM.LTB
face_texture=Characters/infected/face/CM_FC_NM_VIRUS_HM.DTX
face_renderstyle0=RenderStyles/default.ltb
face_renderstyle1=RenderStyles/TRANSPARENT.LTB
face_socket=Head
face_align_node=Head
face_auto_align=1

# Manual tuning remains available after auto alignment.
face_pos_x=0
face_pos_y=0
face_pos_z=0
face_rot_x=0
face_rot_y=0
face_rot_z=0

# Optional custom head/headgear child. Blank for the stock normal infected;
# the decrypted AIModel only declares AttachFace/AIFace for this character.
head_model=
head_texture=

# ST_M_CHILD.LTB has a dedicated virus/infected animation bank (VIL).
idle_anim=VLST
walk_anim=VLWFR
run_anim=VLRFR

# Exact ST_M_CHILD attack/jump names are intentionally left data-driven until
# verified from the local model string report generated during asset staging.
attack_anim1=
attack_anim2=
attack_anim3=
jump_anim=

death_anim=VDIE
death_seconds=1.8

# Assassins use their own body and animation-bank LTB (confirmed in the
# locally supplied Chars_Files_Updated.zip). Both original material textures
# are staged by scripts/stage-local-assets.ps1.
[infected_assassin]
body_model=Characters/infected/body/VIW_F_NM_DF_ASSASSIN_CH.LTB
animation_model=Characters/infected/body/ANI_VI_ASSASSIN_CH.LTB
body_texture0=Characters/infected/body/CW_VST_ASSAVIRUS_HM.DTX
body_texture1=Characters/infected/body/CW_LG_ASSAVIRUS_HM.DTX
body_texture2=Characters/infected/body/CW_FC_NM_VIRUS_HM.DTX
body_texture3=Characters/infected/body/CW_FC_NM_VIRUS_HM.DTX
body_renderstyle0=RenderStyles/default.ltb
face_mode=none
idle_anim=VLST
walk_anim=VLWFR
run_anim=VLRFR
# Do not guess special attack/death names from printable-string scans.
attack_anim1=
attack_anim2=
attack_anim3=
jump_anim=VLJJ
death_anim=
death_seconds=1.2

# The Crusher body model contains Tanker_Head / Tanker_Upper / Tanker_Lower
# material names; the archive supplies the three blue textures below.
[infected_tanker]
body_model=Characters/infected/body/VIM_F_NM_DF_TANKER_SH.LTB
animation_model=Characters/infected/body/ANI_VI_TANKER_SH.LTB
# Tanker body LTB declares mesh materials in Head, Lower, Upper order.
body_texture0=Characters/infected/body/CM_FC_TANKERBLUE_YK.DTX
body_texture1=Characters/infected/body/CM_LG_TANKERBLUE_YK.DTX
body_texture2=Characters/infected/body/CM_VST_TANKERBLUE_YK.DTX
body_renderstyle0=RenderStyles/default.ltb
face_mode=none
idle_anim=VLST
walk_anim=VLWFR
run_anim=VLRFR
attack_anim1=
attack_anim2=
attack_anim3=
jump_anim=VLJJ
death_anim=
death_seconds=1.5
