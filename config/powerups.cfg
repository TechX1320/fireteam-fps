# FIRETEAM Mutation Box / round reward configuration.
# Uses local Combat Arms FX.zip assets. No CA assets are committed to git.

[mutation_box]
enabled=1

model=FX/MUTATION/SND/MUTATION_BUFF_SH.LTB
texture=FX/MUTATION/SND/MUTATION_WHITE_SH.DTX
renderstyle=RenderStyles/default.ltb
pickup_sound=FX/MUTATION/SND/GET.WAV

# Every infected death rolls this percentage.
kill_drop_chance=10

# Round clear also rolls a number of boxes near the surviving squad.
round_clear_min=0
round_clear_max=4

# Weighted random reward table.
ammo_weight=45
health_weight=25
bottomless_weight=15
one_hit_weight=15

# Rare, deliberately strong timed rewards.
god_weight=2
wallhack_weight=3

# Ammo adds this many full magazines to every firearm reserve.
ammo_magazines=2
health_amount=35

# Normal and easier difficulties add this full duration on every pickup.
# Medium+ still stacks, but later pickups add progressively less time.
bottomless_seconds=30
one_hit_seconds=30

# God Mode is personal damage immunity. Wallhack is a team/global zombie
# render effect because the authoritative zombie RenderStyle is shared.
god_seconds=10
wallhack_seconds=20

lifetime_seconds=25
