# FIRETEAM Mutation Box / round reward configuration.
# Uses local Combat Arms FX.zip assets. No CA assets are committed to git.

[mutation_box]
enabled=1

model=FX/MUTATION/SND/MUTATION_BUFF_SH.LTB
texture=FX/MUTATION/SND/MUTATION_WHITE_SH.DTX
renderstyle=RenderStyles/default.ltb
pickup_sound=FX/MUTATION/SND/GET.WAV

# Every infected death rolls this percentage.
kill_drop_chance=10

# Round clear also rolls a number of boxes near the surviving squad.
round_clear_min=0
round_clear_max=4

# Weighted random reward table.
ammo_weight=45
health_weight=25
bottomless_weight=15
one_hit_weight=15

# Ammo adds this many full magazines to every firearm reserve.
ammo_magazines=2
health_amount=35

bottomless_seconds=60
one_hit_seconds=30
lifetime_seconds=25
