# Fireteam infected content definitions.
# Runtime C++ contains behavior only; model paths, stats and attachment offsets
# live here so custom infected can be created without recompiling the game.
#
# Values marked CA come from the supplied decrypted Combat Arms data.
# Values marked DEV are temporary gameplay/attachment tuning values.

[settings]
default=normal_common

[normal_common]
id=normal_common
name=Normal Infected

# CA Normal_Infecter_Common_D
health=150
run_speed=140

# DEV combat tuning until the matching CA attack attributes are mapped.
attack_damage=10
attack_range=55
attack_cooldown=1.0
update_seconds=0.10

# Prefer the authored LTB animation/model user dimensions. Explicit values
# remain fallback data for custom models that do not publish useful dimensions.
collision_mode=model
collision_x=24
collision_y=53
collision_z=24

# CA body / shared male animation child.
body_model=Characters/infected/body/MT_AR_BODY.LTB
animation_model=Characters/infected/body/ST_M_CHILD.LTB
body_texture0=Characters/infected/body/MT_AR_BODY.DTX
body_texture1=Characters/infected/body/MT_MG_LEG.DTX

# CA AttachFace=1 / INFECTED_VIRUS_FACE. This LTB carries the same full
# skeleton hierarchy as the body, so compose it as a child model rather than
# attaching its Scene Root to the body's Head socket.
face_mode=child_model
face_model=Characters/infected/face/CM_FC_NM_VIRUS_HM.LTB
face_texture=Characters/infected/face/CM_FC_NM_VIRUS_HM.DTX
face_socket=Head

# CA also ships a matching modular virus head/headgear model. The previous
# body+face composition still rendered headless in FIRETEAM, so include this
# companion as a testable child model. Exact CA attachment metadata is still
# being recovered; this is intentionally not labeled as a verified CA rule.
head_model=Characters/infected/head/CM_HLMT_NM_VIRUS_HM.LTB
head_texture=Characters/infected/head/CM_HLMT_NM_VIRUS_HM.DTX

# Used only by attachment-mode faces/accessories.
face_pos_x=0
face_pos_y=0
face_pos_z=0
face_rot_x=0
face_rot_y=0
face_rot_z=0

# Animation name resolved from ST_M_CHILD.
idle_anim=K_idle_0
