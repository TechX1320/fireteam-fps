# FIRETEAM infected gameplay definitions.
# Character/model composition lives separately in config/characters.cfg.

[settings]
default=normal_common

[normal_common]
id=normal_common
name=Normal Infected

# Combat Arms Normal_Infecter_Common_D.
health=150

# CA-style approach behavior: infected can stalk toward the target until they
# have a clear corridor/are close enough, then transition to the run bank.
walk_speed=72
run_speed=140
alert_distance=300

# Once the infected acquires the player, keep chasing the last observed
# position briefly after line of sight breaks before falling back to SEARCH.
target_memory_seconds=3.5

# DEV combat tuning until the matching attack-damage path is fully mapped.
attack_damage=10
attack_range=55
attack_cooldown=1.0
attack_anim_seconds=0.65

# Infected can hop authored steps/low blockers above the ordinary 42-unit
# stair allowance. The exact visual animation comes from characters.cfg.
jump_height=88
jump_anim_seconds=0.45

# AI targets/pathfinding still update every 0.10s (10 Hz). Movement toward
# each decision's collision-tested target is divided into smaller server
# steps, reducing the old 100ms stop-motion jumps.
# 1 = old behavior; 2 = 20Hz motion; 3 = 30Hz (recommended); 4 = 40Hz.
# This is authoritative server motion, not a fake client-only render trick.
update_seconds=0.10
motion_substeps=3

# Original Combat Arms Cabin Fever normal-infected voice bank.
voice_dir=Snd/COOPMODE/NPC_VOICE/CABINFEVER/NORMAL
voice_alert=SEEENEMY.WAV
voice_attack1=ATTACK1.WAV
voice_attack2=ATTACK2.WAV
voice_attack3=ATTACK3.WAV
voice_death=DEATH.WAV
voice_radius=850
voice_alert_chance=55
voice_attack_chance=35

# Prefer authored model dimensions, with these values as fallback.
collision_mode=model
collision_x=24
collision_y=53
collision_z=24
