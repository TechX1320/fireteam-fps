name: Gameplay validation

on:
  push:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/gameplay-rules.yml"
  pull_request:
    paths:
      - "src/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/gameplay-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-rules:
    name: Portable rules (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable tests (no proprietary SDK)
        run: cmake -S tests -B out/portable -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build out/portable --config Debug
      - name: Run regression tests
        run: ctest --test-dir out/portable -C Debug --output-on-failure
      - name: Package exact tracked source snapshot
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: |
          mkdir -p out/review
          git archive --format=zip --output=out/review/fireteam-source.zip HEAD
          git rev-parse HEAD > out/review/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        with:
          name: fireteam-source-${{ github.sha }}
          path: out/review/
          retention-days: 14
          if-no-files-found: error
