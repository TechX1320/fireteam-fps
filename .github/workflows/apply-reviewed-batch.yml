name: Apply reviewed gameplay batch

on:
  push:
    branches: [gameplay/combat-feel-melee-aim-20261027]
    paths:
      - '.github/gameplay-batch-*.py'
      - '.github/workflows/apply-reviewed-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/gameplay/combat-feel-melee-aim-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally tested edits and verify complete source tree
        shell: python
        run: |
          import pathlib, subprocess, hashlib
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          parts=sorted(pathlib.Path('.github').glob('gameplay-batch-*.py'))
          assert len(parts)==8, 'Incomplete reviewed batch'
          scripts=[(str(p),p.read_text(encoding='utf-8')) for p in parts]
          helpers=[str(p) for p in parts]+['.github/workflows/apply-reviewed-batch.yml']
          subprocess.run(['git','merge-base','--is-ancestor','b38eb02a006d6c716339e392db2960324580ea37','HEAD'],check=True)
          subprocess.run(['git','rm',*helpers],check=True)
          assert git('write-tree')=='9f145350f2c3fbb9643d7591919f7777397c9414', 'Baseline changed; stop rather than overwrite'
          def valid(path):
              p=pathlib.Path(path)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              return p
          def new(path,text):
              p=valid(path); assert not p.exists(), path
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding='utf-8')
          def edit(path,sha,edits):
              p=valid(path); text=p.read_text(encoding='utf-8')
              assert hashlib.sha256(text.encode()).hexdigest()==sha, 'Source mismatch: '+path
              for start,end,replacement in reversed(edits):
                  assert 0<=start<=end<=len(text), path
                  text=text[:start]+replacement+text[end:]
              p.write_text(text,encoding='utf-8')
          scope={'new':new,'edit':edit}
          for name,source in scripts: exec(compile(source,name,'exec'),scope)
          subprocess.run(['git','add','-A'],check=True)
          actual=git('write-tree')
          assert actual=='f0af4cbafc0945eb4047dbe008c167323d2ec4cf', 'Tree differs from locally tested snapshot: '+actual
      - name: Run native contracts and config-preservation tests
        run: |
          cmake -S tests -B /tmp/fireteam-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/fireteam-tests --parallel 2
          ctest --test-dir /tmp/fireteam-tests --output-on-failure
      - name: Publish code only without force or workflow permission escalation
        shell: bash
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows/gameplay-rules.yml .github/workflows/apply-reviewed-batch.yml '.github/gameplay-batch-*.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'gameplay: readable combat, committed melee, authored reloads and preserved configs'
          git push origin HEAD:gameplay/combat-feel-melee-aim-20261027
